<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫雷竞速</title><link rel="stylesheet" href="/style.css?v=20261016"></head>
<body><main class="app"><header><div><p class="eyebrow">MINESWEEPER ARENA</p><h1>扫雷竞速</h1><p class="sub">独立棋盘 · 公平计时 · 最佳成绩榜</p></div><div id="connection" class="pill">连接中…</div></header>
<section id="lobby" class="panel"><h2>准备开始</h2><label>玩家昵称<input id="playerName" maxlength="24" value="Player" placeholder="请输入昵称"></label><label>难度<select id="difficulty"><option value="easy">简单 · 9×9 / 10 雷</option><option value="medium">中等 · 16×16 / 40 雷</option><option value="hard">困难 · 16×30 / 99 雷</option></select></label><button id="startBtn">生成可解棋盘并开始</button><p class="hint">每位玩家拥有独立棋盘和计时。使用同一网站的排行榜比较成绩；当前版本不提供实时观战。</p><div class="divider"></div><div class="section-head"><h2>我的存档</h2><button id="refreshSaves" class="secondary small">刷新</button></div><div id="saves" class="empty">读取存档中…</div><div class="divider"></div><div class="section-head"><h2>最佳成绩排行榜</h2><select id="leaderboardDifficulty" class="filter"><option value="">全部难度</option><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></div><div id="leaderboard" class="empty">读取排行榜中…</div></section>
<section id="game" class="panel hidden"><div class="game-top"><div><p class="eyebrow">GAME ID</p><strong id="gameIdLabel">------</strong></div><div class="stats"><div><span class="stat-label">用时</span><b id="timer">00:00</b></div><div><span class="stat-label">地雷</span><b id="mineCounter">10</b></div></div></div><div class="game-actions"><button id="pauseBtn" class="secondary">暂停</button><button id="saveExitBtn" class="secondary">保存并退出</button><button id="exitBtn" class="danger">退出不保存</button></div><p id="gameMessage" class="game-message">左键翻开，右键插旗。</p><div id="pauseOverlay" class="overlay hidden"><div><h2>已暂停</h2><p>计时已停止。</p><button id="resumeBtn">继续游戏</button></div></div><div class="board-scroll"><div id="board" class="board"></div></div></section><p id="toast" class="toast" role="status"></p></main><script src="/socket.io/socket.io.js"></script><script src="/app.js?v=20261016b"></script></body></html>
